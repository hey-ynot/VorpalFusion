<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VorpalFusion</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --amber: #f5a524; --ink: #ecebe8; --dim: #9c9890; --faint: #6c6963; --panel: #0a0a0a; --line: #1e1e1e;
          --glass: #0c0c0cd9; --edge: #ffffff14; --hover: #ffffff0f; --r: 10px; --ease: cubic-bezier(.2, .7, .2, 1);
          --tint: color-mix(in srgb, var(--amber) 14%, transparent); --tint-edge: color-mix(in srgb, var(--amber) 45%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; grid-template-columns: minmax(0, 1fr);
         background: #000; color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif; overflow: hidden;
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  [hidden] { display: none !important; }
  button { height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--edge); background: #ffffff0a; color: var(--ink); cursor: pointer;
           font: inherit; font-size: 13px; white-space: nowrap; transition: background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease); }
  button:hover { background: #ffffff17; }
  button:disabled { opacity: .5; cursor: default; }
  button[aria-pressed=true] { background: var(--tint); border-color: var(--tint-edge); color: var(--amber); }
  select, input[type=number], input[type=text] { height: 32px; min-width: 0; border-radius: var(--r); border: 1px solid var(--edge); background: #ffffff0a;
           color: var(--ink); padding: 0 10px; font: inherit; font-size: 13px; }
  input[type=range] { width: 110px; height: 24px; accent-color: var(--amber); }
  kbd { font: inherit; }

  /* The stage: a status line on top, the tools rail on the left, the picture everywhere else. Nothing overlaps the picture. */
  .stage { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
           grid-template-areas: "top top" "rail view"; overflow: hidden; container-type: size; min-height: 200px; isolation: isolate; }
  .stage::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 0; background: linear-gradient(transparent, #000); pointer-events: none; }
  .glow { position: absolute; inset: -20%; width: 140%; height: 140%; filter: blur(90px) saturate(1.3); opacity: .28; z-index: -1; pointer-events: none; }
  .top { grid-area: top; position: relative; z-index: 4; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 16px 4px; }
  .brand { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
  .brand span { color: var(--amber); }
  /* One status line: what is happening, the GPU, and a timings toggle; the live job's progress runs along its bottom edge. */
  .hudline { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: min(760px, 100%); height: 32px; padding: 0 4px 0 14px;
             border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); overflow: hidden; backdrop-filter: blur(20px); }
  .hudline:has(.status:is(.failed, .busy, .offline, .needs)) { background: #2a1d05e6; border-color: var(--tint-edge); }
  .status { display: flex; align-items: center; gap: 8px; min-width: 0; margin: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .status:is(.live, .refining, .finishing, .climbing, .queued, .loading, .waiting)::before { background: var(--amber); box-shadow: 0 0 0 3px var(--tint); }
  .status:is(.settled, .graduated, .kept, .downloaded)::before { background: var(--ink); }
  .status:is(.failed, .busy, .offline, .needs) { color: var(--amber); }
  .status:is(.failed, .busy, .offline, .needs)::before { background: var(--amber); }
  .status:empty { display: none; }
  .meter { flex: 0 1 auto; min-width: 0; margin: 0; padding-left: 10px; border-left: 1px solid var(--edge); font-size: 12px; color: var(--dim);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter:empty { display: none; }
  .meter.off { color: var(--amber); }
  #hudbtn { flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%; font-size: 12px; font-weight: 600; color: var(--dim); }
  .pulse { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--amber); width: 0; transition: width 70ms linear; }
  .settled .pulse { opacity: 0; transition: opacity .6s .4s; }
  .hud { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); z-index: 4; margin: 0; padding: 4px 12px; border-radius: 999px;
         background: var(--glass); font-size: 12px; color: var(--dim); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

  /* The tools rail: a label and its key, pressed state in amber. */
  .rail { grid-area: rail; z-index: 3; display: flex; flex-direction: column; gap: 2px; width: 168px; padding: 10px 8px 12px 14px; overflow: auto; scrollbar-width: none; }
  .rail h2 { margin: 12px 8px 4px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; }
  .rail h2:first-child { margin-top: 2px; }
  .rail button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 34px; padding: 0 8px 0 10px;
                 border-color: transparent; background: transparent; text-align: left; }
  .rail button:hover { background: var(--hover); }
  .rail button[aria-pressed=true] { background: var(--tint); border-color: var(--tint-edge); }
  .rail button::after { content: attr(data-key) / ""; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--edge);
                        font-size: 11px; line-height: 18px; text-align: center; color: var(--dim); }
  .rail button[aria-pressed=true]::after { color: var(--amber); border-color: var(--tint-edge); }
  .split { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0; }
  .split button { flex: 1; height: 28px; padding: 0; justify-content: center; border-color: var(--edge); font-size: 13px; }
  .split button::after { content: none; }

  /* The picture: as large as the view allows, a caption row under it (what it is · the ladder). */
  .view { grid-area: view; position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; container-type: size; }
  .frame { --cols: 1; --rows: 1; --cap: 46px; --grid: calc(var(--aspect, 1) * var(--cols) / var(--rows)); position: relative; margin-bottom: var(--cap);
           width: min(100cqw - 32px, (100cqh - 24px - var(--cap)) * var(--grid)); aspect-ratio: var(--grid); }
  .frame > img, .frame > video { position: absolute; left: 0; top: 0; width: calc(100% / var(--cols)); height: calc(100% / var(--rows));
               object-fit: contain; border-radius: 14px; transition: opacity 280ms ease, filter 160ms ease-out; }
  .frame > #compare { width: 100%; height: 100%; }
  .cells { position: absolute; inset: 0; z-index: 1; }
  .cells:empty { display: none; }
  .cell { position: absolute; width: calc(100% / var(--cols)); height: calc(100% / var(--rows)); padding: 0; border: 0; border-radius: 14px;
          background: transparent; outline-offset: -3px; }
  .cell:hover { background: transparent; }
  .cell img { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }
  .cell img:not([src]) { visibility: hidden; }
  .cell .n { position: absolute; left: 8px; top: 8px; min-width: 22px; height: 22px; border-radius: 999px; background: #000b; color: var(--amber);
             font-size: 12px; line-height: 22px; }
  .cell:hover, .cell:focus-visible { outline: 2px solid var(--amber); }
  /* Split: a 3 px gutter around each panel, the stage's own picture included. */
  .frame:has(.cells:not(:empty)) > :is(img, video):not(#compare), .cell { padding: 3px; }
  .frame:has(.cells:not(:empty)) > img { border-radius: 16px; }
  .cap { position: absolute; left: 0; right: 0; top: 100%; z-index: 3; display: flex; justify-content: flex-end; align-items: center; gap: 8px; height: var(--cap); padding-top: 8px; }
  .tag { margin-right: auto; min-width: 0; padding: 4px 10px; border-radius: 999px; background: var(--glass); color: var(--amber); font-size: 12px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag:empty { display: none; }
  /* The ladder: the rung on stage, then what to do with a good picture. */
  .ladder { flex: none; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--edge); }
  .ladder:not(:has(> :not([hidden]):not(:empty))) { display: none; }
  .empty:not([hidden]) + .frame .ladder { display: none; }
  .ladder button { height: 28px; padding: 0 11px; border-color: transparent; background: transparent; border-radius: 9px; }
  .ladder button:hover { background: var(--hover); }
  #grad { background: var(--amber); color: #111; font-weight: 600; }
  #grad:hover { background: color-mix(in srgb, var(--amber) 85%, #fff); }
  #grad:disabled { background: var(--tint); color: var(--amber); opacity: 1; }
  #dl { padding: 0 11px 0 9px; }
  .rung { padding: 0 8px 0 9px; color: var(--amber); font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .rung:empty { display: none; }
  .node[data-rung]::before { content: attr(data-rung); position: absolute; left: 2px; bottom: 2px; padding: 0 3px; border-radius: 3px; background: #000c;
                             font-size: 8px; line-height: 11px; color: var(--amber); white-space: nowrap; }
  .node.climbing { animation: climb 1s ease-in-out infinite alternate; }
  @keyframes climb { to { box-shadow: 0 0 0 3px #f5a52466; } }
  /* A playing clip: a duration bar along its bottom edge and a sound toggle, out of the way while it plays. */
  .scrub { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 14px; display: flex; align-items: flex-end; cursor: pointer;
           opacity: .7; transition: opacity .2s; touch-action: none; }
  .scrub .track { position: relative; width: 100%; height: 2px; background: #ffffff1f; border-radius: 0 0 14px 14px; overflow: hidden; transition: height .12s; }
  .scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--amber); }
  .scrub .time { position: absolute; right: 8px; bottom: 10px; font-size: 11px; color: var(--ink); text-shadow: 0 1px 3px #000; opacity: 0; }
  .scrub:hover .track, .scrub:focus .track { height: 6px; }
  .scrub:hover .time, .scrub:focus .time { opacity: 1; }
  .vol { position: absolute; right: 10px; bottom: 14px; z-index: 3; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: #000a;
         border-radius: 50%; opacity: 0; transition: opacity .25s; }
  .vol svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .frame:hover .vol, .vol:focus-visible, .frame.paused .vol, .frame:hover .scrub, .scrub:focus-visible, .frame.paused .scrub { opacity: 1; }
  .frame.clip.playing:not(:hover):not(:focus-within) .scrub { opacity: .7; }
  .frame > img { transition-duration: 90ms, 160ms; }
  .frame .back { opacity: 0; }
  .frame img:not([src]), .frame video:not([src]) { display: none; }
  .settled .frame > img { filter: none !important; }
  .stale .frame > :is(img, video):not(.back):not(#compare) { filter: grayscale(.7) brightness(.45) !important; }
  #compare { z-index: 2; background: #000; }
  /* Layout boxes and the pin: a thin overlay on the picture, 0-1000 on both sides; H hides it. */
  .boxes { position: absolute; inset: 0; z-index: 2; pointer-events: none; touch-action: none; }
  .boxes.tool { pointer-events: auto; cursor: crosshair; }
  .boxes.off > * { display: none; }
  .box { position: absolute; border: 1px solid var(--amber); border-radius: 3px; background: #f5a52412; pointer-events: auto; cursor: move; }
  .box:focus-visible { outline: 2px solid var(--amber); }
  .box input { position: absolute; left: -1px; bottom: 100%; width: 9em; height: 22px; margin-bottom: 3px; padding: 0 7px; font-size: 12px;
               color: var(--amber); background: #000c; border: 1px solid var(--amber); border-radius: 6px; }
  .box .grip { position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; border-radius: 2px; background: var(--amber); cursor: nwse-resize; }
  .box .x { position: absolute; right: -9px; top: -9px; width: 18px; height: 18px; padding: 0; border-radius: 999px; font-size: 11px; line-height: 16px; background: #000c; }
  .pinned { position: absolute; border: 1px dashed #8fe3ff; border-radius: 3px; pointer-events: none; box-shadow: 0 0 0 1px #0008; }
  .pinned::before { content: 'pinned'; position: absolute; left: 4px; bottom: 3px; font-size: 10px; color: #8fe3ff; text-shadow: 0 1px 2px #000; }
  .empty { position: absolute; z-index: 3; margin: 0; padding: 0 24px; color: var(--dim); font-size: 17px; letter-spacing: -.01em; text-align: center; line-height: 1.6; }
  .empty .addpic { margin-bottom: 8px; padding: 0 18px; height: 40px; font-size: 15px; border-color: var(--tint-edge); background: var(--tint); color: var(--amber); }
  .next { position: absolute; right: 16px; top: 8px; z-index: 3; width: 128px; border-radius: 10px; overflow: hidden; opacity: 0; transition: opacity .2s;
          outline: 1px solid var(--edge); }
  .next.on { opacity: 1; }
  .next img { display: block; width: 100%; filter: blur(1px); }
  .next span { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: var(--amber); text-shadow: 0 1px 4px #000; }
  .stage.drop::after { content: 'Drop a picture'; position: absolute; inset: 12px; border: 2px dashed var(--amber); border-radius: 20px;
                       display: grid; place-items: center; color: var(--amber); font-size: 18px; background: #000a; z-index: 5; }
  /* The seed field and side by side: overlays over the whole stage. */
  .field { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: #000000eb; opacity: 0; pointer-events: none;
           transition: opacity .18s; backdrop-filter: blur(12px); }
  .field.on { opacity: 1; pointer-events: auto; }
  .fieldbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 12px; }
  .fieldbar input[type=range] { width: 90px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 2px; align-items: center; color: var(--dim); font-size: 12px; }
  .chips button { height: 28px; padding: 0 9px; font-size: 12px; border-color: transparent; background: transparent; border-radius: 8px; color: var(--dim); }
  .chips button:hover { background: var(--hover); color: var(--ink); }
  .chips button[aria-pressed=true] { background: var(--tint); border-color: var(--tint-edge); color: var(--amber); }
  .chips > span[aria-hidden] { width: 1px; height: 16px; margin: 0 5px; background: var(--edge); color: transparent; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100cqh - 72px, 100cqw - 24px); }
  .grid button { height: auto; padding: 0; aspect-ratio: var(--aspect, 1); border-radius: 10px; overflow: hidden; background: #111 center/cover;
                 border: 1px solid #222; }
  .grid button.current { outline: 2px solid var(--amber); }
  .grid button[aria-busy=true] { background-image: linear-gradient(100deg, #111 30%, #1d1d1d 50%, #111 70%); background-size: 200% 100%;
                                 animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .ab { position: absolute; inset: 0; z-index: 7; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center;
        padding: 14px; background: #000000f2; }
  .ab figure { margin: 0; flex: 1 1 260px; max-width: 48%; min-width: 0; }
  .ab img { width: 100%; max-height: 70cqh; object-fit: contain; border-radius: 10px; }
  .ab figcaption { margin-top: 6px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ab button { position: absolute; top: 12px; right: 12px; }
  /* What the model read: beside the picture, under the status line. */
  .read { position: absolute; right: 16px; top: 56px; z-index: 4; width: min(340px, calc(100% - 32px)); max-height: calc(100% - 120px); overflow: auto;
          padding: 12px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--edge); font-size: 13px; line-height: 1.5; backdrop-filter: blur(20px); }
  .read h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .read p { margin: 0 0 10px; }
  .read ins { color: var(--amber); text-decoration: none; background: #f5a5241f; border-radius: 3px; }
  .read del { color: var(--dim); text-decoration: line-through; }
  .read .use { height: 28px; font-size: 12px; }

  /* The clip timeline: a card per picture slot at its moment; references with their role. Only for clip templates. */
  .timeline { display: flex; gap: 12px; align-items: stretch; padding: 10px max(16px, calc((100% - 980px) / 2)) 24px; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .timeline .refs { display: flex; gap: 6px; }
  .timeline .track { position: relative; flex: 1; min-width: 120px; height: 64px; margin: 0 28px; border-bottom: 1px solid #333; }
  .timeline .tick { position: absolute; bottom: -17px; transform: translateX(-50%); white-space: nowrap; font-size: 10px; color: var(--dim); }
  .card { position: relative; width: 56px; height: 56px; padding: 0; border-radius: 10px; border: 1px dashed #3a3a3a; background: #111 center/cover;
          display: grid; place-items: end center; color: var(--dim); font-size: 10px; overflow: hidden; }
  .track .card { position: absolute; top: 2px; transform: translateX(-50%); }
  .card:not(.has)::before { content: '＋'; position: absolute; inset: 0 0 14px; display: grid; place-items: center; font-size: 20px; color: var(--amber); }
  .card.has { border-style: solid; border-color: #ffffff40; color: var(--ink); }
  .card.over { border-color: var(--amber); }
  .card span { width: 100%; padding: 1px 2px; background: #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .chip { position: absolute; top: 3px; left: 3px; right: auto; width: auto; padding: 0 5px; border-radius: 999px; color: var(--amber); }

  /* The words: the hero control, a composer centred under the picture; its pictures above, its template and size below. */
  .bar { display: flex; justify-content: center; padding: 6px 16px 14px; min-width: 0; }
  .composer { display: flex; flex-direction: column; gap: 6px; width: min(980px, 100%); min-width: 0; padding: 8px; border-radius: 20px; background: #101010;
              border: 1px solid var(--edge); box-shadow: 0 10px 40px #0009; transition: border-color .16s var(--ease); }
  .composer:focus-within { border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
  .media { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 2px 0; }
  .media:has(> .tray:is(:empty, [hidden])):has(> #libbtn[hidden]):has(> #strength[hidden]) { display: none; }
  textarea { display: block; width: 100%; min-width: 0; resize: none; min-height: 52px; max-height: 32vh; field-sizing: content; padding: 8px 10px; border: 0;
             background: transparent; color: var(--ink); font: inherit; font-size: 18px; line-height: 1.4; letter-spacing: -.01em; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus, textarea:focus-visible { outline: none; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  #template { flex: 0 1 250px; max-width: 100%; font-weight: 500; }
  #model { flex: 0 1 200px; }
  .opts .chips { flex: 1 1 auto; min-width: 0; }
  #settings { margin-left: auto; }
  #libbtn { height: 30px; font-size: 12px; }
  .tray { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot { position: relative; display: inline-flex; }
  .slot .pick { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 4px; font-size: 12px; }
  .slot .pick:not(.has) { padding-left: 10px; border-style: dashed; color: var(--dim); }
  .slot .pick img { width: 24px; height: 24px; object-fit: cover; border-radius: 6px; }
  .slot .pick.over { border-color: var(--amber); }
  .slot .pick .role { font-style: normal; color: var(--amber); font-size: 11px; }
  .slot .unpick { width: 24px; height: 24px; padding: 0; margin-left: -4px; align-self: center; font-size: 12px; border-radius: 50%; }
  #strength { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }

  /* The snapshot tree: a filmstrip along the foot; branches take a lane each. */
  .tree { display: flex; align-items: stretch; gap: 8px; max-height: 118px; min-width: 0; border-top: 1px solid var(--line); background: var(--panel); }
  .tree .tools { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 8px 0 8px 14px; }
  .tree .tools button { height: 26px; font-size: 12px; padding: 0 10px; color: var(--dim); }
  .lanes-wrap { flex: 1; min-width: 0; overflow: auto; scrollbar-width: thin; }
  .lanes { position: relative; min-height: 60px; }
  .lanes .hint { margin: 20px 6px; color: var(--faint); font-size: 12px; }
  .lanes svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #ffffff26; stroke-width: 1.5; }
  .node { position: absolute; width: 40px; height: 40px; padding: 0; transform: translate(-50%, -50%); border-radius: 8px;
          background: #1a1a1a center/cover; border: 1px solid #ffffff30; }
  .node:hover { background-color: #222; border-color: #ffffff70; }
  .node.auto { width: 30px; height: 30px; border-radius: 50%; opacity: .7; }
  .node.head { outline: 2px solid var(--amber); outline-offset: 1px; opacity: 1; }
  .node.sel { outline: 2px dashed var(--amber); outline-offset: 3px; }
  .node.clip::after { content: '▶'; position: absolute; right: 2px; top: 1px; font-size: 9px; color: var(--amber); text-shadow: 0 1px 2px #000; }
  .dlhover { position: fixed; z-index: 20; width: 22px; height: 22px; padding: 0; font-size: 12px; line-height: 20px; background: #000d; border-radius: 6px; }

  /* Sheets: the library on the left, settings on the right; out of the way until opened. */
  .lib, .drawer { position: fixed; top: 0; bottom: 0; z-index: 10; overflow: auto; padding: 18px 18px 24px; background: #0e0e0ef2; backdrop-filter: blur(24px); }
  .lib { right: 0; width: min(380px, 100vw); border-left: 1px solid var(--line); }
  .drawer { right: 0; width: min(360px, 100vw); border-left: 1px solid var(--line); }
  .lib h2, .drawer h2 { margin: 2px 0 16px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .lib .close, .drawer .close { position: absolute; top: 14px; right: 14px; height: 30px; }
  .lib .find { display: flex; gap: 6px; margin-bottom: 12px; }
  .lib .find input { flex: 1; }
  .libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .libgrid button { height: auto; aspect-ratio: 1; padding: 0; border-radius: 8px; overflow: hidden; background: #111 center/cover; }
  .drawer h3 { margin: 22px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--faint);
               text-transform: uppercase; letter-spacing: .07em; }
  .drawer .row, .tune > label, .tune .knobs label { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 0 0 14px; color: var(--dim); font-size: 12px; }
  .drawer label > span { color: var(--ink); }
  .drawer label > :is(input:not([type=checkbox]), select) { grid-column: 1 / -1; }
  .drawer .row.switch { display: flex; align-items: center; gap: 8px; }
  .drawer input[type=range] { width: 100%; }
  .tune .chips { display: flex; margin: 0 0 14px; }
  .tune .lbl { margin: 0 0 6px; color: var(--dim); font-size: 12px; }
  .rail h2:has(+ .split[hidden]) { display: none; }
  .tune .knobs { display: grid; }
  #seedv { width: 100%; }
  .framed #libbtn, .framed .lib, .framed #keep { display: none !important; }
  .framed #template, .framed .drawer .tpl { display: none !important; }
  .framed .brand { visibility: hidden; }

  /* Wide: the view gives back the rail's width on its right, so the picture centres on the page under the status line. */
  @media (min-width: 1100px) { .view { padding-right: 168px; } .next { right: 184px; } }
  /* Narrow: the rail becomes a row of tools under the picture; the meter and key hints step aside. */
  @media (max-width: 720px) {
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "view" "rail"; }
    .top { grid-template-columns: auto minmax(0, 1fr); padding: 10px 12px 2px; }
    .hudline { justify-self: end; }
    .meter { display: none; }
    .rail { flex-direction: row; width: auto; gap: 4px; padding: 5px 12px 6px; overflow-x: auto; }
    .rail h2 { display: none; }
    .wide { display: none; }
    #dl { width: 32px; padding: 0; }
    .rail button { width: auto; height: 32px; padding: 0 11px; border-color: var(--edge); background: #ffffff0a; }
    .rail button::after { content: none; }
    .split { flex-wrap: nowrap; gap: 2px; }
    .split button { width: 32px; flex: none; }
    .frame { --cap: 42px; width: min(100cqw - 20px, (100cqh - 12px - var(--cap)) * var(--grid)); }
    .bar { padding: 4px 8px 8px; }
    .composer { padding: 6px; border-radius: 16px; }
    textarea { font-size: 16px; min-height: 44px; }
    #template { flex: 1 1 0; order: -2; }
    #model { order: -2; }
    #settings { order: -1; margin-left: 0; }
    .opts .chips { order: 1; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(to right, #000 85%, transparent); }
    .rail { mask-image: linear-gradient(to right, #000 85%, transparent); }
    .tree { max-height: 92px; }
    .lib, .drawer { width: 100vw; }
  }
  @media (max-height: 640px) { .rail h2 { display: none; } .rail button { height: 30px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .frame > img { filter: none !important; }
    .glow { display: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas class="glow" id="glow" width="32" height="32"></canvas>
  <header class="top">
    <h1 class="brand">Vorpal<span>Fusion</span></h1>
    <div class="hudline">
      <p class="status" id="status">Connecting…</p>
      <p class="meter" id="meter" title="The GPU: ms per step on this card, whether the model ran resident, and who is ahead"></p>
      <button type="button" id="hudbtn" aria-pressed="false" aria-controls="hud" title="Timings">i</button>
      <div class="pulse" id="pulse"></div>
    </div>
    <p class="hud" id="hud" hidden></p>
  </header>
  <nav class="rail" aria-label="Tools">
    <h2>Shape</h2>
    <button type="button" id="boxbtn" hidden aria-pressed="false" data-key="O" aria-keyshortcuts="O" title="Box tool (O): draw a box on the picture and name what goes there; drag or resize it, every move renders; H hides the boxes">Box</button>
    <button type="button" id="pinbtn" hidden aria-pressed="false" data-key="P" aria-keyshortcuts="P" title="Pin (P): draw a region of the picture that stays exactly as it is while the words change the rest; Esc or P again unpins">Pin</button>
    <button type="button" id="flowbtn" hidden aria-pressed="false" data-key="W" aria-keyshortcuts="W" title="Flow (W): each live picture starts from the last one, so the picture bends with every word instead of re-rendering">Flow</button>
    <button type="button" id="refbtn" data-key="F" aria-keyshortcuts="F" title="Pin as reference (F): the picture on stage becomes the reference; a template with no picture slot switches to its family's edit template">As reference</button>
    <button type="button" id="lock" aria-pressed="false" data-key="L" aria-keyshortcuts="L" title="Lock the composition at a middle step: new words change only the detail (L)">Lock</button>
    <h2>Seed</h2>
    <button type="button" id="seeds" data-key="G" aria-keyshortcuts="G" title="The seed field (G)" aria-haspopup="dialog">Seeds</button>
    <button type="button" id="reroll" data-key="R" aria-keyshortcuts="R" aria-label="New seed" title="New seed (R, ⌘R); ⌥← ⌥→ step it">New seed</button>
    <h2>Keep</h2>
    <button type="button" class="pin" id="pin" data-key="S" aria-keyshortcuts="S" aria-label="Take a snapshot (S)" title="Take a snapshot (S)">Snapshot</button>
    <h2>Panels</h2>
    <span class="split" id="split" hidden role="group" aria-label="Panels"><button type="button" data-n="1" aria-pressed="true">1</button><button type="button" data-n="2" aria-pressed="false">2</button><button type="button" data-n="4" aria-pressed="false">4</button></span>
  </nav>
  <div class="view" id="view">
    <p class="empty" id="empty">Type to see it develop · drop a picture to start from it</p>
    <div class="frame" id="frame">
      <img id="a" alt=""><img id="b" class="back" alt="">
      <video id="va" class="back" muted loop playsinline></video><video id="vb" class="back" muted loop playsinline></video>
      <div class="cells" id="cells"></div>
      <div class="boxes" id="boxes" aria-label="Layout boxes"></div>
      <img id="compare" alt="" hidden>
      <div class="cap">
        <span class="tag" id="tag"></span>
        <div class="ladder" role="group" aria-label="Ladder">
          <span class="rung" id="rung" title="The rung on stage: Live, Settled, Final, 2K, 4K"></span>
          <button type="button" id="grad" hidden aria-keyshortcuts="U" title="Graduate (U): the next rung of this picture, same words, seed and pictures, more fidelity, in the background">▲ Final</button>
          <button type="button" id="enrich" hidden aria-keyshortcuts="E" title="Final with the template's prompt enhancer rewriting the words (E)">Enrich</button>
          <button type="button" id="readbtn" hidden aria-pressed="false" aria-controls="read" title="How the enhancer rewrote the words">Read</button>
          <button type="button" id="keep" hidden aria-keyshortcuts="K" title="Keep the highest rung of this picture (K)">Keep</button>
          <button type="button" id="dl" hidden aria-keyshortcuts="D" aria-label="Download this picture (D)" title="Download this picture at its rung, the original with its workflow (D)">⤓<span class="wide"> Download</span></button>
          <button type="button" id="cancel" hidden title="Cancel this clip: nothing renders until you change something">Cancel</button>
        </div>
      </div>
      <div class="scrub" id="scrub" role="slider" tabindex="-1" hidden aria-label="Clip position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="track"><div class="fill" id="fill"></div></div><span class="time" id="cliptime"></span>
      </div>
      <button type="button" class="vol" id="vol" hidden aria-pressed="false" aria-label="Sound (M)" title="Sound (M)"></button>
    </div>
    <div class="next" id="next" aria-hidden="true"><img id="nextimg" alt=""><span id="nextlabel">developing</span></div>
  </div>
  <div class="field" id="field" inert aria-label="Seed field">
    <div class="fieldbar"><span class="chips" id="fieldmode" role="group" aria-label="Field"><button type="button" data-m="seeds" aria-pressed="true">Seeds</button><button type="button" data-m="variations" aria-pressed="false">Variations</button></span>
      <label id="varyrow" hidden>strength <span id="varyv">0.4</span><input id="vary" type="range" min="0.1" max="0.8" step="0.05" value="0.4" aria-label="Variation strength"></label></div>
    <div class="grid" id="grid"></div></div>
  <div class="ab" id="ab" hidden role="dialog" aria-label="Side by side">
    <figure><img id="abA" alt=""><figcaption id="abAc"></figcaption></figure>
    <figure><img id="abB" alt=""><figcaption id="abBc"></figcaption></figure>
    <button type="button" id="abclose">Close</button>
  </div>
  <aside class="read" id="read" hidden aria-label="What the model read">
    <h3>You wrote</h3><p id="wrote"></p>
    <h3>The model read</h3><p id="modelread"></p>
    <button type="button" class="use" id="usewords" title="Put the words the model read in the box">Use these words</button>
  </aside>
  <p class="sr" id="say" role="status" aria-live="polite"></p>
</main>
<section class="timeline" id="timeline" hidden aria-label="Clip timeline: pictures at their moments">
  <div class="refs" id="refs"></div>
  <div class="track" id="track"></div>
</section>
<form class="bar" onsubmit="return false">
  <div class="composer">
    <div class="media">
      <div class="tray" id="tray" aria-label="Pictures"></div>
      <button type="button" id="libbtn" hidden aria-controls="lib" aria-expanded="false" title="Saddle's library: drag a result onto a picture slot or the stage">Library</button>
      <input id="file" type="file" accept="image/*" hidden>
      <label id="strength" hidden>change <span id="stv">0.6</span><input id="st" type="range" min="0.2" max="1" step="0.05" value="0.6" aria-label="Change"></label>
    </div>
    <label class="sr" for="prompt">Words</label>
    <textarea id="prompt" placeholder="Say what you see…" autofocus></textarea>
    <div class="opts">
      <select id="template" aria-label="Template"></select>
      <select id="model" hidden aria-label="Model" title="Model: the template's own, or a fine-tune of its model file"></select>
      <span id="size" class="chips"></span>
      <button type="button" id="settings" aria-controls="drawer" aria-expanded="false">Settings</button>
    </div>
  </div>
</form>
<nav class="tree" id="tree" aria-label="Snapshots" hidden>
  <div class="tools">
    <button type="button" id="export" title="Save the snapshot tree as a file">Export</button>
    <button type="button" id="import" title="Load a snapshot tree from a file">Import</button>
    <button type="button" id="dlsel" hidden title="Download the selected snapshots as one zip with a manifest (shift-click or X selects)">Download</button>
    <input id="importfile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="lanes-wrap" id="laneswrap"><div class="lanes" id="lanes"></div></div>
</nav>
<button type="button" class="dlhover" id="dlhover" hidden aria-label="Download (D)" title="Download this picture at its rung (D)">⤓</button>
<aside class="lib" id="lib" hidden aria-label="Saddle's library">
  <h2>Library</h2>
  <button type="button" class="close" id="libclose">Close</button>
  <div class="find"><input type="text" id="libq" placeholder="Search the library" aria-label="Search the library"><select id="libboard" aria-label="Board"><option value="">All results</option></select></div>
  <div class="libgrid" id="libgrid"></div>
</aside>
<aside class="drawer" id="drawer" hidden aria-label="All settings">
  <h2>Settings</h2>
  <button type="button" class="close" id="drawerclose">Close</button>
  <div class="tune">
    <p class="lbl">Speed</p>
    <span class="chips" id="speed" role="group" aria-label="Speed" title="Speed: each live picture in about 250, 400 or 700 ms on this GPU (auto: the template's live profile)">
      <button type="button" data-s="" aria-pressed="true">auto</button><button type="button" data-s="snappy" aria-pressed="false">snappy</button><button type="button" data-s="balanced" aria-pressed="false">balanced</button><button type="button" data-s="pretty" aria-pressed="false">pretty</button></span>
    <label>Live steps <span id="lpv">auto</span><input id="lp" type="range" min="0" max="8" value="0" aria-label="Live steps"></label>
    <label>Seed <input id="seedv" type="number" min="0" step="1" aria-label="Seed"></label>
    <span id="tknobs" class="knobs"></span>
  </div>
  <div class="tpl">
    <h3>Template</h3>
    <label class="row switch"><input type="checkbox" id="plumbing"> Show node plumbing</label>
    <div id="controls"></div>
  </div>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const framed = window.parent !== window;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
// Storage is unavailable in an opaque-origin sandbox: everything then lives for the session only.
const store = (() => { try { const s = window.localStorage; s.setItem('gv.probe', '1'); s.removeItem('gv.probe'); return s; } catch { return null; } })();
const load = (key, fallback) => { try { return JSON.parse(store?.getItem(key) ?? 'null') ?? fallback; } catch { return fallback; } };
const save = (key, value) => { try { store?.setItem(key, JSON.stringify(value)); return true; } catch { return false; } };
const hostOrigin = (() => { try { return new URL(document.referrer).origin; } catch { return '*'; } })();
function tell(type, data = {}) { if (framed) parent.postMessage({ source: 'gpu-vision', type, ...data }, hostOrigin === 'null' ? '*' : hostOrigin); }
window.gvLog = [];  // displayed frames {t, v, kind, stage}, for checks

// The turn: what the sidecar renders.
const saved = load('gv.state', {});
let templates = [], profile = null, template = saved.template || '';
let seed = saved.seed ?? Math.floor(Math.random() * 2 ** 31), values = saved.values || {}, sources = saved.sources || [];
let aspect = saved.aspect || 1, liveOn = !framed, hostBusy = false, timer = 0;
let panels = saved.panels || 1, panel = null, panelSet = null;  // split panels: how many, the one picked (it settles), the batch on stage
let v = Date.now(), sentV = 0, epochV = v, shownV = -1, settledV = -1;  // nothing from before this page is current
const thumbs = {}, rels = {};  // picture id -> displayable URL; Saddle library rel -> picture id
$('prompt').value = saved.prompt || ''; $('st').value = saved.strength ?? 0.6; $('stv').textContent = $('st').value;

// Words go out on a word boundary: while a word is being typed (the caret at the end, a key in the
// last 250 ms) the words stop before it (except the first word, so the first frame waits for nothing), so no job is spent on a fragment the encoder cannot read;
// the whole text goes out once the keys rest 250 ms, and the settle then waits less (the words
// already rested).
const WORD_REST = 250;
let typedAt = -1e9, sentWords = null, sentTyping = false, restTimer = 0, restSend = false;
// Fast typing (keys under 120 ms apart) renders one size smaller until the first pause; the speed dial sets the target.
const FAST_KEYS = 120;
let fastKeys = false, speed = saved.speed || '', ahead = null;
// Step lock, the seed field's mode, a picked variation, and what speculation should render ahead.
let lock = null, fieldMode = saved.field || 'seeds', variation = null, lastKnob = null, graduated = 0;
// Layout boxes ([ymin, xmin, ymax, xmax] on 0-1000 with a word each), the pin ({id, rect}: a picture and the region of it that
// stays), the tool drawing on the stage ('box' | 'pin'), and whether the overlay is hidden (H).
let boxes = saved.boxes || [], pinned = null, tool = null, boxesOff = false;
// Flow (W): each live frame starts from the last one's latent, re-noised by how much the words changed.
let flowOn = !!saved.flow, flowKind = null;
let model = saved.model || null;  // a fine-tune of the template's model file, by label (null: the template's own)
const FLOW_WORDS = { reset: 'fresh start', same: 'same words', word: 'a word', phrase: 'a phrase' };
function words() {
  const box = $('prompt'), text = box.value;
  if (performance.now() - typedAt >= WORD_REST || document.activeElement !== box || box.selectionEnd !== text.length) return text;
  if (/[\s,.;:!?]$/.test(text)) return text.trimEnd();  // a word just ended
  const m = text.match(/^([\s\S]*[\s,.;:!?])[^\s,.;:!?]+$/);
  return m ? m[1].trimEnd() : text;  // the first word goes out as it is typed: the first frame waits for nothing
}
function turn() {
  return { v: sentV, template, prompt: words(), seed, values, sources, strength: +$('st').value, aspect,
           live_steps: +$('lp').value || null, rest_ms: restSend ? 200 : 450, speed: speed || undefined,
           fast: fastKeys && performance.now() - typedAt < WORD_REST || undefined, lock: lock || undefined,
           field: fieldMode, vary_strength: +$('vary').value, variation: variation || undefined, knob: lastKnob || undefined,
           likely: graduated > 0 || undefined, panels: splitOn() ? panels : undefined, boxes: layoutBoxes(), pin: pinOn() ? pinned : undefined, flow: flowOn && profile?.flow || undefined, model: model || undefined,
           panel: splitOn() ? panel ?? undefined : undefined,
           typing: performance.now() - typedAt < WORD_REST || undefined };  // mid-sentence: live only, no settle yet
}
function persist() { save('gv.state', { template, prompt: $('prompt').value, seed, values, sources, strength: +$('st').value, aspect, panels, speed, field: fieldMode, boxes, flow: flowOn, model }); }
const layoutBoxes = () => profile?.layout && boxes.some((b) => b.desc.trim()) ? boxes.filter((b) => b.desc.trim()).map((b) => ({ bbox: b.bbox, desc: b.desc.trim() })) : undefined;
const pinOn = () => !!(profile?.pin && pinned);
const splitOn = () => panels > 1 && !!profile?.panels;
let dog = 0, heardAt = 0;
async function send() {
  sentV = v = Math.max(v + 1, Date.now());  // a clock, so a job from before a reload never reads as current
  if (keyAt !== null && keyFromV === null) keyFromV = sentV;
  const state = turn(); restSend = false; sentWords = state.prompt; sentTyping = !!state.typing;
  // The watchdog: words that changed and got neither a frame nor a phase within 1.5 s say so.
  clearTimeout(dog);
  dog = setTimeout(() => { if (liveOn && shownV < sentV && performance.now() - heardAt > 1400 && !QUIET.includes(ph) && ph !== 'loading') phase('waiting'); }, 1500);
  persist();
  tell('state', { state: { ...state, sources: sources.map((s) => ({ ...s, rel: relOf(s.id) })) } });
  document.body.classList.remove('settled');
  stageRung = profile?.kind === 'video' ? 'draft' : 'live'; ladderControls(); layoutPanels();
  stale();
  if (!liveOn) return phase('idle');
  if (!hostBusy && profile) await post('state', JSON.stringify(state));
}
function soon() { panel = null; variation = null; clearTimeout(timer); timer = setTimeout(send, 60); keyAt ??= performance.now(); }
function typed() {
  fastKeys = performance.now() - typedAt < FAST_KEYS;
  typedAt = performance.now(); keyAt ??= typedAt; panel = null; variation = null;
  clearTimeout(timer); clearTimeout(restTimer);
  if (words() !== sentWords) timer = setTimeout(send, 60);
  restTimer = setTimeout(() => { if (words() !== sentWords || sentTyping) { restSend = true; send(); } }, WORD_REST);
}
const relOf = (id) => Object.keys(rels).find((rel) => rels[rel] === id);

async function call(path, init) {
  try {
    const r = await fetch(path, init);
    if (r.status >= 500) phase('failed', { message: `VorpalFusion's sidecar could not do that (HTTP ${r.status}). Try again in a moment.` });
    return r;
  } catch { phase('offline'); return null; }
}
const post = (path, body, headers) => call(path, { method: 'POST', body, headers });

// One plain status line; failures read as a sentence with what to do.
let ph = '', lastLive = null, lastJob = null, keyToFrame = null, keyAt = null, keyFromV = null;
const loadTimes = load('gv.loads', {});
const QUIET = ['failed', 'busy', 'offline', 'idle', 'needs', 'waiting', 'canceled'];
function phase(name, extra = {}) {
  const mp = +(profile?.megapixels ?? 1).toFixed(1);
  const seconds = (ms) => `${(ms / 1000).toFixed(1)} s`;
  const text = {
    loading: () => `Loading ${extra.title || profile?.title || 'the template'}${loadTimes[template] ? ` · ~${Math.max(1, Math.round(loadTimes[template] / 1000))} s` : '…'}`,
    needs: () => !extra.label || extra.label === 'source' ? 'Drop a picture to edit' : `Drop a picture for the ${extra.label}`,
    idle: () => !liveOn ? 'Live is off' : 'Type to see it develop',
    live: () => flowOn && profile?.flow ? `Flow${flowKind ? ` · ${FLOW_WORDS[flowKind] || flowKind}` : ''}${lastLive ? ` · ${Math.round(lastLive)} ms` : ''}${pinOn() ? ' · pinned' : ''}` : pinOn() ? `Pinned · typing changes the rest${lastLive ? ` · ${seconds(lastLive)}` : ''}` : lock ? `Composition locked at step ${lock.step} of ${lock.of}${lastLive ? ` · ${seconds(lastLive)}` : ''}` : lastLive ? `Live · ${seconds(lastLive)}` : 'Live',
    refining: () => `Refining ${extra.step}/${extra.steps}`,
    finishing: () => profile?.kind === 'video' ? 'Finishing (decoding the clip)' : `Finishing (decoding ${mp} MP)`,
    settled: () => profile?.kind === 'video' ? `Full clip · made in ${seconds(extra.ms)} · its motion can differ from the draft` : `Settled · ${seconds(extra.ms)}`,
    queued: () => `${RUNG_NAMES[extra.rung]} · ${extra.ahead ? `${extra.ahead} ahead` : 'next when the GPU rests'}`,
    climbing: () => extra.steps ? `${RUNG_NAMES[extra.rung]} ${extra.step}/${extra.steps}` : `Graduating to ${RUNG_NAMES[extra.rung]}…`,
    graduated: () => `${RUNG_NAMES[extra.rung]} · ${seconds(extra.ms)}${extra.size ? ` · ${extra.size.join('×')}` : ''}`,
    kept: () => extra.path ? `Kept · ${extra.path.split('/').pop()}` : 'Sent to Saddle to keep',
    downloaded: () => `Downloaded · ${extra.name}`,
    downloading: () => 'Downloading…',
    keeping: () => 'Keeping…',
    canceled: () => 'Canceled · change anything to render again',
    busy: () => extra.owner === 'gpu-vision' ? `Waiting for another VorpalFusion · ${extra.ahead} ahead` : `GPU shared · ${extra.ahead} ahead`,
    waiting: () => extra.why === 'loading' ? `Loading ${extra.title || profile?.title || 'the template'}…` : 'Waiting on the GPU',
    offline: () => 'Offline: reconnecting',
    failed: () => extra.message || 'Something failed without saying why. Change the words or settings to try again.',
  }[name]();
  const changed = name !== ph;
  ph = name;

  const style = [m.chip ? '' : `left:${100 * Math.min(1, t / clipLength())}%`, s ? `background-image:url(${thumbs[s.id] || `source/${s.id}`})` : ''].filter(Boolean).join(';');
  return `<button type="button" class="card${s ? ' has' : ''}" data-slot="${esc(m.address)}" draggable="${!!s}"${style ? ` style="${esc(style)}"` : ''}`
    + ` aria-label="${esc(m.label)}, ${esc(where)}: ${s ? 'a picture; arrows move, Delete removes' : 'empty; drop or press Enter'}">`
    + `${m.chip ? `<span class="chip">${esc(m.chip)}</span>` : ''}<span>${esc(m.label)}</span></button>`;
}
function renderTimeline() {
  const on = timelined(); $('timeline').hidden = !on; $('tray').hidden = on;
  if (!on) return;
  const L = clipLength();
  $('refs').innerHTML = profile.media.filter((m) => m.chip).map(card).join('');
  $('track').innerHTML = profile.media.filter((m) => !m.chip).map(card).join('')
    + [0, L / 2, L].map((t) => `<span class="tick" style="left:${100 * t / L}%">${+t.toFixed(1)} s</span>`).join('');
}
const cardOf = (el) => el?.closest?.('.card');
const metaOf = (slot) => profile.media.find((m) => m.address === slot);
function swapSlots(a, b) {
  const A = sources.find((x) => x.slot === a), B = sources.find((x) => x.slot === b);
  sources = sources.filter((x) => x !== A && x !== B).concat(A ? [{ ...A, slot: b }] : [], B ? [{ ...B, slot: a }] : []);
}
function timelineChanged(said) { epochV = v + 1; renderControls(); persist(); send(); if (said) $('say').textContent = said; }
function removeSlot(slot) { sources = sources.filter((x) => x.slot !== slot); timelineChanged(`${metaOf(slot)?.label} removed`); }
function moveTo(m, seconds) {
  values[m.moment.address] = +Math.max(0, Math.min(clipLength(), seconds)).toFixed(1);
  timelineChanged(`${m.label} at ${values[m.moment.address]} s`);
}
let draggedCard = null, droppedOnStrip = false;
$('timeline').addEventListener('dragstart', (e) => {
  const c = cardOf(e.target); if (!c) return;
  draggedCard = c.dataset.slot; droppedOnStrip = false;
  e.dataTransfer.setData('application/x-gv-card', c.dataset.slot); e.dataTransfer.effectAllowed = 'move';
});
$('timeline').addEventListener('dragend', () => {  // dropped off the strip: removed
  if (draggedCard && !droppedOnStrip) removeSlot(draggedCard);
  draggedCard = null;
});
$('timeline').addEventListener('dragover', (e) => { e.preventDefault(); cardOf(e.target)?.classList.add('over'); });
$('timeline').addEventListener('dragleave', (e) => cardOf(e.target)?.classList.remove('over'));
$('timeline').addEventListener('drop', (e) => {
  e.preventDefault(); e.stopPropagation(); droppedOnStrip = true;
  const target = cardOf(e.target), from = e.dataTransfer.getData('application/x-gv-card');
  if (from) {
    if (target && target.dataset.slot !== from) { swapSlots(from, target.dataset.slot); return timelineChanged(`${metaOf(from).label} and ${metaOf(target.dataset.slot).label} swapped`); }
    const m = metaOf(from), r = $('track').getBoundingClientRect();
    if (m?.moment && e.clientX >= r.left - 20 && e.clientX <= r.right + 20) moveTo(m, (e.clientX - r.left) / r.width * clipLength());
    return;
  }
  if (target) place(dropped(e.dataTransfer), target.dataset.slot);
});
$('timeline').addEventListener('click', (e) => { const c = cardOf(e.target); if (c) { pickSlot = c.dataset.slot; $('file').click(); } });
$('empty').addEventListener('click', (e) => { const b = e.target.closest('.addpic'); if (b) { pickSlot = b.dataset.slot; $('file').click(); } });
$('timeline').addEventListener('keydown', (e) => {
  const c = cardOf(e.target); if (!c) return;
  const m = metaOf(c.dataset.slot), has = sources.some((x) => x.slot === m.address);
  if ((e.key === 'Delete' || e.key === 'Backspace') && has) { e.preventDefault(); removeSlot(m.address); refocus(m.address); }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && has) {
    e.preventDefault(); e.stopPropagation();
    const by = e.key === 'ArrowRight' ? 1 : -1;
    if (m.moment) moveTo(m, momentOf(m) + by * 0.5);
    else {  // a fixed frame swaps with its neighbour on the strip
      const order = profile.media.filter((x) => !x.chip).sort((a, b) => momentOf(a) - momentOf(b)), at = order.indexOf(m), other = order[at + by];
      if (other) { swapSlots(m.address, other.address); timelineChanged(`${m.label} picture moved to the ${other.label}`); refocus(other.address); return; }
    }
    refocus(m.address);
  }
});
const refocus = (slot) => requestAnimationFrame(() => $('timeline').querySelector(`.card[data-slot="${CSS.escape(slot)}"]`)?.focus());
async function upload(blob) {
  const r = await post('source', blob, { 'content-type': blob.type || 'image/png' });
  if (!r?.ok) { if (r) phase('failed', { message: 'VorpalFusion could not keep that picture. Try another file.' }); return null; }
  return (await r.json()).id;
}
const stage = $('stage');
stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drop'); });
stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
stage.addEventListener('drop', (e) => {
  e.preventDefault(); stage.classList.remove('drop');
  if (e.dataTransfer.getData('application/x-gv-card')) return;  // a timeline card dragged off the strip: its dragend removes it
  place(dropped(e.dataTransfer));
});

function control(c) {
  const value = values[c.address] ?? c.value, name = esc(c.label), a = `data-a="${esc(c.address)}"`;
  if (c.control === 'slider') return `<label class="row">${name} <span>${esc(value)}</span><input type="range" ${a} min="${c.min}" max="${c.max}" step="${c.step}" value="${esc(value)}"></label>`;
  if (c.control === 'number') return `<label class="row">${name}<input type="number" ${a} step="${c.step}" value="${esc(value)}"></label>`;
  if (c.control === 'switch') return `<label class="row switch"><input type="checkbox" role="switch" ${a}${value ? ' checked' : ''}> ${name}</label>`;
  if (c.control === 'choice') return `<label class="row">${name}<select ${a}>${c.choices.map((o) => `<option${String(o) === String(value) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
  return `<label class="row">${name}<input type="text" ${a} value="${esc(value)}"></label>`;
}
function renderDrawer() {
  const all = profile?.settings || [], shown = all.filter((c) => $('plumbing').checked || !c.advanced);
  $('controls').innerHTML = shown.map(control).join('') || `<p>${all.length ? 'Only node plumbing here.' : 'This template has no settings.'}</p>`;
}
$('plumbing').addEventListener('change', renderDrawer);
$('controls').addEventListener('input', (e) => {
  const a = e.target.dataset.a; if (!a) return;
  values[a] = e.target.type === 'checkbox' ? e.target.checked : ['range', 'number'].includes(e.target.type) ? +e.target.value : e.target.value;
  if (e.target.type === 'range') e.target.previousElementSibling.textContent = e.target.value;
  soon();
});
function toggleDrawer(open = $('drawer').hidden) {
  $('drawer').hidden = !open; $('settings').setAttribute('aria-expanded', open);
  if (open) { returnFocus = document.activeElement; renderDrawer(); $('drawerclose').focus(); } else (returnFocus || $('settings')).focus();
}
$('settings').addEventListener('click', () => toggleDrawer());
$('drawerclose').addEventListener('click', () => toggleDrawer(false));
$('st').addEventListener('input', () => { $('stv').textContent = $('st').value; soon(); });
$('lp').addEventListener('input', () => { $('lpv').textContent = +$('lp').value || 'auto'; soon(); });
$('prompt').addEventListener('input', typed);

// The bridge, when Saddle frames the module: Saddle's box drives the template, settings and
// pictures; the module keeps the stage, the seed field and the tree, and reports back.
addEventListener('message', async (e) => {
  if (!framed || e.source !== parent || !e.data || typeof e.data !== 'object') return;
  const m = e.data;
  if (m.type === 'live') { liveOn = !!m.on; if (liveOn) { phase('waiting'); send(); } else phase('idle'); ladderControls(); }
  if (m.type === 'keep') keep();  // Saddle's Keep: the module answers with the highest rung's full recipe
  if (m.type === 'template' && m.name) await useTemplate(m.name);
  if (m.type === 'state' && m.state) await hostState(m.state);
  if (m.type === 'source' && (m.src || m.rel)) {
    const id = await fromHost(m.src, m.rel); if (!id) return;
    const slot = m.slot || profile?.media[0]?.address;
    sources = sources.filter((s) => s.slot !== slot).concat({ slot, id, ...(parents[id] ? { parent: parents[id] } : {}) });
    if (slot === profile?.media[0]?.address) { epochV = v + 1; show(thumbs[id], 0, epochV); }
    renderControls(); send();
  }
  if (m.type === 'busy') { hostBusy = !!m.busy; if (hostBusy) phase('busy', { ahead: m.ahead ?? 'jobs' }); else send(); }
  if (m.type === 'theme') {
    if (m.accent) document.documentElement.style.setProperty('--amber', m.accent);
    if (m.scheme) document.documentElement.style.colorScheme = m.scheme;
  }
});
const parents = {};  // picture id -> the Saddle library result it came from
async function fromHost(src, rel) {  // a library picture: fetched once (by the sidecar, from Saddle's API, when it is a library rel), known by its rel
  if (rel && rels[rel]) return rels[rel];
  if (/^\/api\/artifacts\/[\w.-]+\/content$/.test(rel || '')) {
    const r = await post('source/library', JSON.stringify({ rel }));
    if (r?.ok) { const got = await r.json(); rels[rel] = got.id; parents[got.id] = got.parent; thumbs[got.id] = `source/${got.id}`; return got.id; }
    if (!src) { phase('failed', { message: 'VorpalFusion could not fetch that library picture from Saddle.' }); return null; }
  }
  try {
    const blob = await (await fetch(src)).blob();
    const id = await upload(blob); if (!id) return null;
    thumbs[id] = URL.createObjectURL(blob); if (rel) rels[rel] = id;
    return id;
  } catch { phase('failed', { message: 'Saddle sent a picture VorpalFusion could not read.' }); return null; }
}
async function hostState(st) {
  if (st.template && st.template !== template) await useTemplate(st.template, { quiet: true });
  if (typeof st.prompt === 'string') $('prompt').value = st.prompt;
  if (Number.isFinite(st.seed)) seed = st.seed;
  if (st.values && typeof st.values === 'object') values = { ...st.values };
  if (Array.isArray(st.sources)) {
    const next = [];
    for (const [i, s] of st.sources.entries()) {
      const slot = s.slot || profile?.media[i]?.address, id = s.id || (s.src || s.rel ? await fromHost(s.src, s.rel) : null);
      if (slot && id) next.push({ slot, id, ...(parents[id] ? { parent: parents[id] } : {}) });
    }
    if (sorted(next) !== sorted(sources)) epochV = v + 1;
    sources = next;
  }
  renderControls();
  if (await checkSources()) send();
}

// Start: what the last visit left (template, words, seed, pictures, the tree), then the stream.
document.body.classList.toggle('framed', framed);
setAspect(aspect); $('seedv').value = seed;
renderTree();
if (snapOf(head)?.thumb) show(snapOf(head).thumb, 0, epochV - 1);  // last visit's picture, dimmed until a frame lands
connect();
</script>
</body>
